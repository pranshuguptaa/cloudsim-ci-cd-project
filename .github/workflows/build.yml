name: Java CI with CloudSim

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: List contents of jars folder
      run: ls -l jars

    - name: Compile Java files
      run: |
        mkdir -p classes
        javac -cp "jars/*" -d classes $(find examples -name "*.java")

    - name: Run MySimulation
      run: java -cp "classes:jars/*" mysim.MySimulation
