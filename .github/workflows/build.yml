name: Java CI for My CloudSim Project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Verify JARs exist
      run: |
        ls -la jars

    - name: Compile Java files
      run: |
        mkdir -p classes
        javac -cp "jars/*" -d classes $(find examples -name "*.java")

    - name: Run MySimulation
      run: |
        java -cp "classes:jars/*" mysim.MySimulation
